services:
    redis:
        image: redis:7-alpine
        container_name: lesi-redis-dev
        ports:
            - '6379:6379'
        volumes:
            - redis-dev-data:/data
        command: ['redis-server', '--appendonly', 'yes']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 1s
            retries: 20

volumes:
    redis-dev-data:
