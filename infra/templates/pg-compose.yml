services:
    postgres:
        container_name: lesidev-postgres
        image: postgres:16
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - lesidev
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - 5435:5432

    redis:
        container_name: lesidev-redis
        image: redis:7-alpine
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
        volumes:
            - redis_data:/data
        networks:
            - lesidev
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5

    lesidev:
        container_name: lesidev-api
        image: ghcr.io/lesi97/lesi.dev:latest
        ports:
            - 1550:8080
        networks:
            - lesidev
            - proxy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -qO- http://localhost:8080/healthcheck || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 5
        build:
            context: .
            target: final
        environment:
            - GO_ENV=production
            - DATABASE_URL=postgres://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:?err}?sslmode=disable
            - REDIS_ADDR=redis:6379
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - BUNGIE_CLIENT_ID=${BUNGIE_CLIENT_ID}
            - STEAM_CLIENT_ID=${STEAM_CLIENT_ID}
            - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
            - DISCORD_USER_ID=${DISCORD_USER_ID}
            - ENCRYPTION_KEY=${ENCRYPTION_KEY}
            - PLEX_USERNAME=${PLEX_USERNAME}
            - PLEX_API_URL=${PLEX_API_URL}
            - PLEX_X_TOKEN=${PLEX_X_TOKEN}
            - PLEX_WEBHOOK_SECRET=${PLEX_WEBHOOK_SECRET}
            - WEB_URL=${WEB_URL}
            - API_URL=${API_URL}
            - ANILIST_CLIENT_ID=${ANILIST_CLIENT_ID}
            - ANILIST_CLIENT_SECRET=${ANILIST_CLIENT_SECRET}
            - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
            - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    pgadmin:
        container_name: lesidev-pgadmin
        image: dpage/pgadmin4:latest
        environment:
            - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
            - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - lesidev
            - proxy
        ports:
            - '${PG_ADMIN_PORT}:80'
        restart: no
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
    pgadmin_data:
    redis_data:

networks:
    lesidev:
        driver: bridge
    proxy:
        external: true
